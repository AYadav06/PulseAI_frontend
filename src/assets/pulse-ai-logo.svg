<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="markGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#2B4C8C"/>
    </linearGradient>
  </defs>

  <!-- Dark panel -->
  <rect x="0" y="0" width="460" height="480" rx="28" fill="#16203A"/>

  <!-- Light panel -->
  <rect x="500" y="0" width="460" height="480" rx="28" fill="#F3F6FC"/>

  <!-- ===== Dark panel mark ===== -->
  <rect x="170" y="100" width="120" height="120" rx="28" fill="url(#markGradient)"/>
  <path d="M 188 160 L 210 160 L 222 128 L 234 160 L 252 160"
        fill="none" stroke="#F4F7FD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="264" cy="160" r="7" fill="#F4F7FD"/>

  <text x="135" y="305" font-family="'Inter Variable', Inter, -apple-system, sans-serif" font-weight="700" font-size="46" letter-spacing="-1" fill="#F4F7FD">pulse</text>
  <text x="248" y="305" font-family="'Inter Variable', Inter, -apple-system, sans-serif" font-weight="600" font-size="32" letter-spacing="0.5" fill="#6FA3FF">ai</text>

  <!-- ===== Light panel mark ===== -->
  <rect x="670" y="100" width="120" height="120" rx="28" fill="url(#markGradient)"/>
  <path d="M 688 160 L 710 160 L 722 128 L 734 160 L 752 160"
        fill="none" stroke="#F4F7FD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="764" cy="160" r="7" fill="#F4F7FD"/>

  <text x="635" y="305" font-family="'Inter Variable', Inter, -apple-system, sans-serif" font-weight="700" font-size="46" letter-spacing="-1" fill="#16203A">pulse</text>
  <text x="748" y="305" font-family="'Inter Variable', Inter, -apple-system, sans-serif" font-weight="600" font-size="32" letter-spacing="0.5" fill="#2B6FE0">ai</text>
</svg>
